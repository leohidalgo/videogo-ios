name: test

on:
    push:
        branches:
          - main
          - develop
    pull_request:
        branches:
          - main
          - develop

env:
    HOMEBREW_NO_AUTO_UPDATE: 1
    HOMEBREW_NO_ENV_HINTS: 1
    HOMEBREW_NO_INSTALL_CLEANUP: 1

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
    checkout:
        runs-on: [self-hosted]
        steps:
          - uses: actions/checkout@v4
          - name: Generate L10n
            run: make l10n
          - name: XcodeGen generate project
            run: make xcodeproj
          - name: Persist Workspace
            uses: actions/upload-artifact@v4
            with:
                name: workspace
                include-hidden-files: true
                path: |
                    .
                    !.git
                    !.github

    lint:
        runs-on: [self-hosted]
        needs: [checkout]
        steps:
          - name: Attach Workspace
            uses: actions/download-artifact@v4
            with:
                name: workspace
          - name: Swiftlint
            run: make lint

    tests:
        runs-on: [self-hosted]
        needs: [lint]
        steps:
          - name: Attach Workspace
            uses: actions/download-artifact@v4
            with:
                name: workspace
          - name: Tests
            run: make tests
          - name: SnapshotTests
            run: make snapshot_tests
