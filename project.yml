name: VideoGO-iOS

options:
    bundleIdPrefix: com.leohidalgo
    minimumXcodeGenVersion: 2.43.0
    developmentLanguage: en
    indentWidth: 4
    tabWidth: 4
    xcodeVersion: 1640
    groupSortPosition: top
    generateEmptyDirectories: true

configFiles:
    Debug: xcconfigs/General.xcconfig
    Release: xcconfigs/General.xcconfig

targets:
    VideoGo:
        type: application
        platform: iOS
        sources: [Sources]
        dependencies:
            - package: Localizable
            - package: MediaFeature
        preBuildScripts:
          - name: Run SwiftLint
            path: scripts/swiftlint.sh
            basedOnDependencyAnalysis: false

localPackages:
  - Packages/Core/Localizable
  - Packages/Features/MediaFeature
