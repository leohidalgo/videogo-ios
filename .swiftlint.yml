## Swiftlint: 0.52.4

analyzer_rules:

disabled_rules:
  - accessibility_label_for_image
  - attributes
  - anonymous_argument_in_multiline_closure
  - conditional_returns_on_newline
  - contrasted_opening_brace
  - explicit_acl
  - explicit_enum_raw_value
  - explicit_self
  - explicit_top_level_acl
  - explicit_type_interface
  - file_types_order
  - function_default_parameter_at_end
  - implicitly_unwrapped_optional
  - indentation_width
  - missing_docs
  - multiline_arguments_brackets
  - multiline_parameters_brackets
  - no_extension_access_modifier
  - no_grouping_extension
  - no_magic_numbers
  - object_literal
  - prefer_nimble
  - private_subject
  - required_deinit
  - vertical_whitespace_opening_braces

excluded:
  - "**/Package.swift"
  - Packages/Core/Localizable/Sources/Localizable/L10n.swift

opt_in_rules:
  - all

no_empty_block:
    disabled_block_types:
      - initializer_bodies

file_length:
    ignore_comment_only_lines: true

function_parameter_count:
    warning: 7
    error: 8

identifier_name:
    allowed_symbols:
      - i
    min_length:
        warning: 3
        error: 2

large_tuple:
    warning: 3
    error: 4

line_length:
    warning: 160
    error: 170
    ignores_urls: true
    ignores_interpolated_strings: true

nesting:
    type_level: 2

number_separator:
    minimum_length: 6
    minimum_fraction_length: 6

trailing_whitespace:
    ignores_comments: false

type_name:
    max_length:
        warning: 50
    excluded:
      - E
      - T
      - U
      - V
      - W
